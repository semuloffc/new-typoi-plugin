name: Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  release:
    types: [ created ]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: Petrichor-Windows
          - os: macos-latest
            artifact_name: Petrichor-macOS
          - os: ubuntu-latest
            artifact_name: Petrichor-Linux

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libx11-dev libxcomposite-dev libxcursor-dev libxinerama-dev libxrandr-dev libxrender-dev libfreetype6-dev libglu1-mesa-dev libjack-jackd2-dev libcurl4-openssl-dev

    - name: Configure CMake
      shell: bash
      run: |
        if [ "$RUNNER_OS" == "macOS" ]; then
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
        else
          cmake -B build -DCMAKE_BUILD_TYPE=Release
        fi

    - name: Build
      run: cmake --build build --config Release --parallel

    - name: Locate plugin
      shell: bash
      run: |
        VST3_PATH=$(find build -type d -name "Petrichor.vst3" | head -n 1)
        if [ -z "$VST3_PATH" ]; then
          echo "Petrichor.vst3 not found"
          find build -maxdepth 4 -name "*.vst3"
          exit 1
        fi
        echo "Found: $VST3_PATH"
        echo "VST3_PATH=$VST3_PATH" >> "$GITHUB_ENV"

    - name: Download pluginval
      if: runner.os != 'Linux'
      shell: bash
      run: |
        if [ "$RUNNER_OS" == "Windows" ]; then
          curl -L -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
          7z x pluginval.zip
        else
          curl -L -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -o pluginval.zip
        fi

    - name: Run pluginval
      if: runner.os != 'Linux'
      shell: bash
      continue-on-error: true
      run: |
        if [ "$RUNNER_OS" == "Windows" ]; then
          ./pluginval.exe --strictness-level 5 --validate-in-process --verbose "$VST3_PATH"
        else
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate-in-process --verbose "$VST3_PATH"
        fi

    - name: Package
      shell: bash
      run: |
        mkdir -p package
        cp -r "$VST3_PATH" package/
        if [ "$RUNNER_OS" == "Windows" ]; then
          echo 'Install to: C:\Program Files\Common Files\VST3\' > package/INSTALL.txt
        elif [ "$RUNNER_OS" == "macOS" ]; then
          echo 'Install to: /Library/Audio/Plug-Ins/VST3/ or ~/Library/Audio/Plug-Ins/VST3/' > package/INSTALL.txt
        else
          echo 'Install to: ~/.vst3/ or /usr/local/lib/vst3/' > package/INSTALL.txt
        fi
        cp README.md package/

    - name: Create archive
      shell: bash
      run: |
        VERSION=$(tr -d '[:space:]' < VERSION)
        cd package
        if [ "$RUNNER_OS" == "Windows" ]; then
          7z a "../Petrichor-v${VERSION}-Windows.zip" *
        else
          zip -ry "../Petrichor-v${VERSION}-${{ matrix.artifact_name }}.zip" *
        fi

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: Petrichor-*.zip
        if-no-files-found: error

    - name: Upload release asset
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: Petrichor-*.zip